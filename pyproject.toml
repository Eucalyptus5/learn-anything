[project]
name = "learn-anything"
version = "0.0.0"
description = "Voice-first, visually-augmented tutor for learning a codebase."
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.15",
    "av>=17.1,<18",
    "aiohttp>=3.10",
    "numpy>=2.0",
    "faster-whisper>=1.2",
    "onnxruntime>=1.20",
    "kokoro-onnx>=0.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=3.8",
    "httpx2>=2.12",
]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/data/fixture_repo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/data"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

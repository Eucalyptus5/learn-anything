[project]
name = "learn-anything"
version = "0.0.0"
description = "Voice-first, visually-augmented tutor for learning a codebase."
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
bench = [
    "faster-whisper>=1.2",
    "kokoro-onnx>=0.6",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "openai>=1.0",
    "aiortc>=1.15",
]

<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>tutor diagram</title>
<style>
  body { font: 14px ui-monospace, Menlo, monospace; margin: 0; padding: 1rem; background: transparent; }
  body[data-theme="dark"] { color: #ebeae6; }
  #d { overflow: auto; }
  #d svg { max-width: 100%; height: auto; }
</style>

<div id="d"></div>

<script src="/vendor/mermaid.min.js"></script>
<script type="module">
const KINDS = new Set(["flowchart", "sequence"]);
const INIT = {
  startOnLoad: false,
  securityLevel: "strict",
  htmlLabels: false,
  suppressErrorRendering: true,
};
const FADE_MS = 450;
const STEP_MS = 500;
const PART_MS = 350;
const EASE = "cubic-bezier(.2,.7,.2,1)";
const still = matchMedia("(prefers-reduced-motion: reduce)");
const d = document.getElementById("d");
let chain = Promise.resolve();
let reveal = 0;

mermaid.initialize(INIT);

function nodeName(id) {
  return id.replace(/^.*?flowchart-/, "").replace(/-\d+$/, "");
}

function edgeId(id) {
  return id.replace(/^.*?(?=L_)/, "");
}

function edgeEnds(id, names) {
  const rest = id.replace(/^L_/, "").replace(/_\d+$/, "");
  for (const from of names) {
    const to = rest.slice(from.length + 1);
    if (rest.startsWith(from + "_") && names.has(to)) return [from, to];
  }
  return null;
}

function flowchartSteps(svg) {
  const nodes = [...svg.querySelectorAll("g.node")];
  const names = new Set(nodes.map((node) => nodeName(node.id)));
  const labels = new Map();
  for (const label of svg.querySelectorAll("g.edgeLabel [data-id]")) {
    labels.set(label.dataset.id, label.closest("g.edgeLabel"));
  }
  const edges = [...svg.querySelectorAll("g.edgePaths path")].map((path) => ({
    parts: labels.has(edgeId(path.id)) ? [path, labels.get(edgeId(path.id))] : [path],
    ends: edgeEnds(edgeId(path.id), names),
    shown: false,
  }));
  const seen = new Set();
  const steps = [];
  for (const node of nodes) {
    seen.add(nodeName(node.id));
    const step = [node];
    for (const edge of edges) {
      if (edge.shown || edge.ends === null || !edge.ends.every((name) => seen.has(name))) continue;
      edge.shown = true;
      step.push(...edge.parts);
    }
    steps.push(step);
  }
  const rest = edges.filter((edge) => !edge.shown).flatMap((edge) => edge.parts);
  if (rest.length > 0) steps.push(rest);
  return steps;
}

function sequenceSteps(svg) {
  return [...svg.querySelectorAll(".messageLine0, .messageLine1")].map((line) => {
    const text = line.previousElementSibling;
    return text !== null && text.matches("text.messageText") ? [line, text] : [line];
  });
}

function show(el) {
  el.style.opacity = "";
  const anim = el.animate([{ opacity: 0 }, { opacity: 1 }], {
    duration: PART_MS,
    easing: "ease-out",
    fill: "forwards",
  });
  anim.onfinish = () => anim.cancel();
}

function stage(svg, kind, token) {
  if (still.matches) return;
  const steps = kind === "flowchart" ? flowchartSteps(svg) : sequenceSteps(svg);
  for (const step of steps) for (const el of step) el.style.opacity = "0";
  d.animate([{ opacity: 0 }, { opacity: 1 }], { duration: FADE_MS, easing: EASE });
  steps.forEach((step, i) => {
    setTimeout(() => {
      if (token !== reveal) return;
      for (const el of step) show(el);
    }, FADE_MS + i * STEP_MS);
  });
}

async function render(m) {
  reveal += 1;
  try {
    const { svg } = await mermaid.render("m" + m.seq, m.source);
    d.innerHTML = svg;
    for (const a of d.querySelectorAll("a")) a.replaceWith(...a.childNodes);
    stage(d.querySelector("svg"), m.kind, reveal);
    return true;
  } catch (err) {
    d.textContent = (err instanceof Error ? err.message : String(err)).split("\n")[0];
    return false;
  }
}

async function clear() {
  reveal += 1;
  d.replaceChildren();
  return true;
}

async function retheme(theme) {
  mermaid.initialize({ ...INIT, theme: theme === "dark" ? "dark" : "default" });
  document.body.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;
  return true;
}

window.addEventListener("message", (event) => {
  if (event.origin !== new URL(location.href).origin) return;
  const m = event.data;
  if (typeof m !== "object" || m === null || typeof m.seq !== "number") return;
  let step;
  if (m.clear === true) {
    step = clear;
  } else if (KINDS.has(m.kind) && typeof m.source === "string") {
    step = () => render(m);
  } else if (m.theme === "light" || m.theme === "dark") {
    step = () => retheme(m.theme);
  } else {
    return;
  }
  const { source, origin } = event;
  chain = chain.then(step).then((ok) => source.postMessage({ seq: m.seq, ok }, origin));
});
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Anything</title>
<meta name="description" content="A tutor you talk with. Ask about anything, and it explains out loud while it draws.">
<meta property="og:title" content="Learn Anything">
<meta property="og:description" content="A tutor you talk with. Ask about anything, and it explains out loud while it draws.">
<meta property="og:image" content="https://yourlearning.space/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#e6e7ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/learn-serif-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="module" src="stage.js"></script>
</head>
<body>
<main>
  <h1 class="brand">Learn Anything</h1>
  <div class="voice" aria-hidden="true">
    <div class="you">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <span class="who">You</span>
      <span class="asked"></span>
    </div>
    <div class="tutor">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <span class="who">Tutor</span>
    </div>
  </div>
  <p class="sentence" aria-hidden="true"></p>
  <svg class="drawing" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  <p class="about">A tutor you talk with. Ask about anything, and it explains out loud while it draws.</p>
  <div class="marks" role="group" aria-label="Lessons"></div>
</main>
</body>
</html>
